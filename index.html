function update(dt){if(mode && performance.now()>=activeUntil)mode=null;if(!running)return;acc+=dt;while(acc>=1){remaining--;acc--;if(remaining<=0){remaining=0;running=false;ceremony=true;ceremonyStart=performance.now();finished=stage===2;break}}let v=mode==='shield'?110:250;if(keys.ArrowLeft||keys.left)player-=v*dt;if(keys.ArrowRight||keys.right)player+=v*dt;player=clamp(player,65,775);for(const e of enemies){e.timer+=dt;if(e.phase==='waiting'){if(e.timer>=e.delay){e.phase='approach';e.timer=0;e.y=-115}continue}if(e.phase==='approach'){e.y+=cfg().speed*dt;e.x+=(player-e.x)*Math.min(1,dt*1.55)+Math.sin(e.timer*5+e.y*.025)*22*dt;if(e.y>=310){e.y=310;e.phase=e.power?'attack':'pause';e.timer=0;e.gas=0;e.targetX=player;e.resolved=false}}else if(e.phase==='pause'&&e.timer>cfg().pause){e.phase=e.power?'warn':'attack';e.timer=0;e.gas=0;e.targetX=player;e.resolved=false}else if(e.phase==='warn'&&e.timer>cfg().warn){e.phase='attack';e.timer=0;e.gas=0;e.targetX=player;e.resolved=false}else if(e.phase==='attack'){e.gas+=dt*15;if(!e.resolved && e.timer>(e.power?.42:.32)){e.resolved=true;let correct=e.power?mode==='shield':mode==='fan';if(correct){score+=e.power?120:40}else if(!e.power&&mode==='shield'){health-=10;score=Math.max(0,score-10)}else{health-=e.power?cfg().strong:cfg().weak}}if(e.timer>(e.power?.72:.55)){e.phase='approach';e.timer=0;e.y=-35-Math.random()*35;e.x=stage===2?(e.side<0?90+Math.random()*230:520+Math.random()*230):100+Math.random()*640;e.power=Math.random()<Math.min(.7,cfg().power+(stage-1)*.1);e.gas=0;e.resolved=false}}}if(health<=0){health=0;running=false;ended=true}}function offering(t){
 const elapsed=(performance.now()-ceremonyStart)/1000, u=Math.min(1,elapsed/1.2), set=Math.max(0,Math.min(1,(elapsed-1.2)/1.8)), settled=Math.max(0,Math.min(1,(elapsed-3.1)/1.3));

 for(let x of [135,170,655,698]){ctx.fillStyle='#8a6d48';ctx.fillRect(x-5,255,10,160);for(let i=0;i<3;i++)ellipse(x+(i-1)*19,246-i*17,37,43,'#7cba7e')}
 ctx.fillStyle='#92bd78';ctx.fillRect(100,409,640,60);ctx.fillStyle='#d7c9ac';ctx.beginPath();ctx.moveTo(325,469);ctx.lineTo(390,342);ctx.lineTo(475,342);ctx.lineTo(545,469);ctx.fill();
 ctx.fillStyle='#8e9d9c';ctx.fillRect(315,354,215,20);ctx.fillStyle='#b9c2bf';ctx.fillRect(335,254,175,100);ctx.fillStyle='#8e9d9c';ctx.fillRect(356,233,133,24);ctx.fillStyle='#cbd1cd';ctx.fillRect(368,151,110,86);ctx.fillStyle='#8e9d9c';ctx.fillRect(365,145,116,12);ctx.fillStyle='#e0e4df';ctx.fillRect(374,157,7,69);
 ctx.textAlign='center';ctx.fillStyle='#667571';ctx.font='bold 27px serif';ctx.fillText(stage===2?'先祖代々之墓':'供養',423,208);
 // 花立と花
 for(const x of [320,530]){ctx.fillStyle='#869b9b';ctx.fillRect(x-12,324,24,32);for(let j=-2;j<=2;j++){line(x,328,x+j*8,294-Math.abs(j)*4,'#4b9062',3);ellipse(x+j*8,292-Math.abs(j)*4,7,8,j%2?'#f2b1c2':'#f7d46c')}}
 // 線香立て
 ctx.fillStyle='#858783';ctx.fillRect(397,340,53,15);for(let i=-1;i<=1;i++)line(423+i*8,340,423+i*8,320,'#9d8067',2);
 // ろうそくが近づき供えられる
 const cx=420+(1-set)*180, cy=321+(1-set)*125;
 ctx.fillStyle='#fdf1d2';ctx.fillRect(cx-10,cy-4,20,38);ctx.fillStyle='#a57d52';ctx.fillRect(cx-13,cy+32,26,6);
 let flick=Math.sin(t/180)*3;ellipse(cx,cy-14+flick,8,15,'#ffac30');ellipse(cx,cy-12+flick,4,9,'#fff0a0');

function draw(t){ctx.clearRect(0,0,840,560);ctx.fillStyle='#bde5f4';ctx.fillRect(0,0,840,560);ctx.fillStyle='#cde6a4';ctx.fillRect(0,125,840,435);for(let i=0;i<9;i++){ellipse(i*110,120,90,65,'#9dcb91');ellipse(i*110+25,160,70,40,'#84b877')}ctx.fillStyle='#e3c69a';ctx.fillRect(0,445,840,115);for(let i=0;i<11;i++)line(i*85,445,i*85,560,'#c9a779',2);ctx.fillStyle='#fff9e9';ctx.fillRect(0,0,840,68);ctx.fillStyle='#503621';ctx.font='bold 23px Meiryo';ctx.fillText('ステージ '+stage,18,28);ctx.fillText('残り '+Math.ceil(remaining)+' 秒',190,28);ctx.fillText('火の元気 '+health+'%',400,28);ctx.fillText('得点 '+score,665,28);ctx.font='16px Meiryo';ctx.fillText('難易度：'+({easy:'やさしい',normal:'ふつう',hard:'むずかしい'}[difficulty])+' ／ 道具：'+(mode==='fan'?'扇子：防御中':mode==='shield'?'盾：防御中':'なし（キーを押して1秒防御）'),22,54);ctx.fillText(stage===1?'お尻 1つ':'お尻 2つ！',675,54);ctx.fillStyle='#c5a37b';ctx.fillRect(0,68,840,7);enemies.filter(e=>e.phase!=='waiting').forEach(e=>butt(e,t));candle(t);if(ceremony){offering(t);return}if(!running){ctx.fillStyle='rgba(66,44,25,.74)';ctx.fillRect(170,185,500,165);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 35px Meiryo';ctx.fillText(ended?(health<=0?'火が消えた！':'ステージ2 クリア！'):'ろうそくの火を守れ！',420,247);ctx.font='21px Meiryo';ctx.fillText(ended?'「開始・やり直し」で再挑戦':'「開始・やり直し」かスペースで開始',420,299);ctx.textAlign='left'}}function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw(t);requestAnimationFrame(loop)}document.getElementById('preview').onclick=()=>{stage=2;running=false;ceremony=true;finished=true;remaining=0;ceremonyStart=performance.now()};document.getElementById('start').onclick=()=>{if(ceremony&&!finished)next();else reset()};document.getElementById('fan').onclick=()=>useTool('fan');document.getElementById('shield').onclick=()=>useTool('shield');for(let d of ['left','right']){let b=document.getElementById(d);b.onpointerdown=e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[d]=false}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.key]=true;if(e.key==='1'&&!e.repeat)useTool('fan');if(e.key==='2'&&!e.repeat)useTool('shield');if(e.code==='Space'&&!running){if(ceremony&&!finished)next();else reset()}});window.addEventListener('keyup',e=>keys[e.key]=false);last=performance.now();requestAnimationFrame(loop);
